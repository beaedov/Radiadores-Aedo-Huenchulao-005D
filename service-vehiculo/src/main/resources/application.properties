spring.application.name=service-vehiculo
server.port=8086

#Conexion a DB vehiculo
spring.datasource.url=jdbc:mysql://localhost:3306/db_vehiculo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/api/v1/vehiculos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS para Swagger del gateway
spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
