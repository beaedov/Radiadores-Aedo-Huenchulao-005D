spring.application.name=service-mecanico
server.port=8087

#Conexion a DB mecanico
spring.datasource.url=jdbc:mysql://localhost:3306/db_mecanico?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
#Ruta donde se genera el JSON con la documentacion de la API
springdoc.api-docs.path=/api/v1/mecanicos/v3/api-docs

#Ruta de la interfaz de swagger (pagina web donde se prueban los endpoints)
springdoc.swagger-ui.path=/swagger-ui.html

# CORS para Swagger del gateway
spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

