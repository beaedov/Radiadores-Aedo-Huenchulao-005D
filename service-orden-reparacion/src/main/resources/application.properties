spring.application.name=service-orden-reparacion
server.port=8085

#Conexion a DB orden-reparacion
spring.datasource.url=jdbc:mysql://localhost:3306/db_orden-reparacion?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/api/v1/ordenes/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS para Swagger del gateway
spring.mvc.cors.allowed-origins=http://localhost:9090
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

